name: Publish Field Notes
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: field-notes-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Build site
        env:
          FIELD_NOTES_REVIEW_CONFIG: ${{ secrets.FIELD_NOTES_REVIEW_CONFIG }}
        run: |
          if [[ -n "$FIELD_NOTES_REVIEW_CONFIG" ]]; then
            export VITE_FIELD_NOTES_HOSTED_REVIEW=true
          fi
          npm run build
          if [[ "$VITE_FIELD_NOTES_HOSTED_REVIEW" == true ]]; then
            printf '%s\n' "$FIELD_NOTES_REVIEW_CONFIG" > dist/reviewer-config.json
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
